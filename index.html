<!DOCTYPE html>
<html lang="es" data-contexto="enfoque">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fokus es una aplicación de productividad que utiliza la técnica Pomodoro para ayudarte a mantener el enfoque y administrar tu tiempo de manera efectiva. Con Fokus, puedes configurar temporizadores personalizados para sesiones de trabajo y descansos, lo que te permite optimizar tu productividad y mantener un equilibrio saludable entre el trabajo y el descanso. Además, Fokus ofrece funciones adicionales como música de enfoque y una lista de tareas para ayudarte a organizar tus actividades diarias. ¡Mejora tu concentración y alcanza tus metas con Fokus!">
    <meta name="author" content="Daniel Rivera Alpízar - Alura Latam">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fokus">
    <meta name="format-detection" content="telephone=no">
    
    <title>Fokus</title>

    
    <link rel="shortcut icon" href="./imagenes/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
        integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prata&family=Unbounded:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/script.js" defer></script>
    <script src="./assets/js/script-crud.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>
    <main id="contenido-principal" class="app">
        <header class="app__header">
            <figure class="app__logo-figure">
                <img class="app__logo-image" src="./imagenes/logo.png" alt="Logo de Fokus">
            </figure>
        </header>
        <section class="app__section-banner-container">
            <h1 class="app__title">
                Optimiza tu productividad,<br>
                <strong class="app__title-strong">sumérgete en lo que importa.</strong>
            </h1>
            <figure class="app__image-figure">
                <img class="app__image" src="./imagenes/enfoque.png" alt="Ilustración de enfoque para iniciar una sesión de trabajo">
            </figure>
        </section>
        <section class="app__section-card-container" aria-label="Controles del temporizador">
            <div class="app__card">
                <ul class="app__card-list" role="group" aria-label="Selecciona el modo del temporizador">
                    <li class="app__card-list-item">
                        <button data-contexto="enfoque" class="app__card-button app__card-button--enfoque active" aria-pressed="true">Enfoque</button>
                    </li>
                    <li class="app__card-list-item">
                        <button data-contexto="short" class="app__card-button app__card-button--corto" aria-pressed="false">Descanso corto</button>
                    </li>
                    <li class="app__card-list-item">
                        <button data-contexto="long" class="app__card-button app__card-button--largo" aria-pressed="false">Descanso largo</button>
                    </li>
                </ul>
                <div id="timer" class="app__card-timer" role="timer" aria-live="polite" aria-atomic="true"></div>
                <ul class="app__card-list">
                    <li class="app__card-list-item">
                        <label class="toggle">
                            <input class="toggle-checkbox" type="checkbox" id="alternar-musica" aria-label="Activar musica de enfoque">
                            <div class="toggle-switch"></div>
                        </label>
                    </li>
                    <li class="app__card-list-item">
                        <label class="app__card-list-label" for="alternar-musica">
                            Música
                        </label>
                    </li>
                </ul>
                <div class="app__card-primary-button-wrapper">
                    <button id="start-pause" class="app__card-primary-button" aria-label="Comenzar temporizador">
                        <img class="app__card-primary-butto-icon" src="./imagenes/play_arrow.png" alt="" aria-hidden="true">
                        <span>Comenzar</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="app__section-task-container" aria-labelledby="lista-tareas-titulo">
            <article class="app__section-task-content">
                <header class="app__section-active-task">
                    <p class="app__section-active-task-label">#En proceso:</p>
                    <p class="app__section-active-task-description"></p>
                </header>
                <div class="app__section-task-header">
                    <h2 id="lista-tareas-titulo" class="app__section-tasks-heading">Lista de tareas</h2>
                    <div class="dropdown-container">
                        <button type="button" class="app_button-more" aria-label="Abrir acciones de tareas" aria-haspopup="menu" aria-expanded="false" aria-controls="task-menu">
                            <img src="./imagenes/more.svg" alt="" aria-hidden="true">
                        </button>
                        <ul id="task-menu" class="app__section-task-header__ul" role="menu" hidden>
                            <li class="app__section-task-header__li">
                                <button type="button" class="app__section-task-header__li__button" id="btn-remover-concluidas" role="menuitem">
                                    <img src="./imagenes/check.svg" alt="" aria-hidden="true">
                                    Quitar tareas completadas
                                </button>
                            </li>
                            <li class="app__section-task-header__li">
                                <button type="button" class="app__section-task-header__li__button" id="btn-remover-todas" role="menuitem">
                                    <img src="./imagenes/trash.svg" alt="" aria-hidden="true">
                                    Quitar todas las tareas
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
                <ul class="app__section-task-list" aria-live="polite" aria-label="Tareas guardadas"></ul>
                <form class="app__form-add-task hidden" aria-hidden="true">
                    <div class="app__form-field">
                        <label class="app__form-label" for="task-description">
                            Agregando tarea
                        </label>
                        <textarea id="task-description" required rows="4" class="app__form-textarea" placeholder="¿En qué estás trabajando?"></textarea>
                    </div>
                    <footer class="app__form-footer">
                        <button type="button" class="app__form-footer__button app__form-footer__button--delete">
                            <img src="./imagenes/delete.png" alt="" aria-hidden="true"> Eliminar
                        </button>
                        <div class="splitter"></div>
                        <button type="button" class="app__form-footer__button app__form-footer__button--cancel">
                            <img src="./imagenes/close.png" alt="" aria-hidden="true"> Cancelar
                        </button>
                        <button class="app__form-footer__button app__form-footer__button--confirm">
                            <img src="./imagenes/save.png" alt="" aria-hidden="true"> Guardar
                        </button>
                    </footer>
                </form>
                <button type="button" class="app__button--add-task" aria-controls="task-description" aria-expanded="false">
                    <img src="./imagenes/add_circle.png" alt="" aria-hidden="true"> Agregar nueva tarea
                </button>
            </article>
        </section>

        <footer class="app__footer" aria-label="Información de derechos reservados">
            <div class="app__footer-content">
                <small class="app__footer-meta">
                    Derechos reservados &copy; 2026 Daniel Rivera Alpízar · Alura Latam</small>
            </div>
        </footer>
    </main>
    <!-- Elemento para anuncios de accesibilidad-->
    <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

</body>

</html>
